name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Install Playwright Browsers
        working-directory: apps/web
        run: npx playwright install --with-deps

      - name: Run database migrations
        working-directory: packages/database
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/myform_test

      - name: Start Express Backend API
        working-directory: apps/api
        run: |
          npx tsx ./src/index.ts &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8123/health | grep -q "healthy"; then
              echo "Backend API is up and healthy!"
              break
            fi
            echo "Waiting for backend API... ($i/30)"
            sleep 1
          done
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/myform_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: dummy_access_secret_1234567890_ci_testing
          JWT_REFRESH_SECRET: dummy_refresh_secret_1234567890_ci_testing
          FRONTEND_URL: http://localhost:3000
          GOOGLE_OAUTH_CLIENT_ID: dummy_google_client_id
          GOOGLE_OAUTH_CLIENT_SECRET: dummy_google_client_secret
          GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8123/auth/google/callback
          RESEND_API_KEY: re_dummy_key_for_testing
          BASE_URL: http://localhost:8123
          PORT: 8123
          NODE_ENV: development

      - name: Run Playwright E2E tests
        run: pnpm --filter web test:e2e
        env:
          CI: true
          SKIP_ENV_VALIDATION: true
          E2E_API_BASE: http://localhost:8123
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/myform_test
          REDIS_URL: redis://localhost:6379
          NEXT_PUBLIC_API_URL: http://localhost:8123/trpc
          JWT_ACCESS_SECRET: dummy_access_secret_1234567890_ci_testing
          JWT_REFRESH_SECRET: dummy_refresh_secret_1234567890_ci_testing
          RAZORPAY_WEBHOOK_SECRET: dummy_webhook_secret_for_ci

      - name: Upload Playwright Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14
